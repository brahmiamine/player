name: Apply recommendation refactor

on:
  push:
    branches: [claude/ios-glass-theme]
    paths: [.github/workflows/apply-recommendation-refactor.yml]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: claude/ios-glass-theme
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Add failing recommendation tests
        run: |
          python3 <<'PY'
          from pathlib import Path

          def insert_before(path: str, marker: str, addition: str) -> None:
              file = Path(path)
              text = file.read_text()
              if addition.strip() in text:
                  return
              if marker not in text:
                  raise SystemExit(f"Marker not found in {path}: {marker}")
              file.write_text(text.replace(marker, addition + marker, 1))

          insert_before(
              "app/src/test/java/fr/streamia/tv/recommendation/ContentSimilarityTest.kt",
              "    private fun features(\n",
              '''    @Test
              fun `same broad genre without related plot is rejected`() {
                  val source = features(
                      10,
                      "Front Line",
                      "Des soldats isolés derrière les lignes ennemies organisent une mission de sauvetage.",
                      genre = "Action, Thriller",
                  )
                  val unrelated = features(
                      11,
                      "Summer Kitchen",
                      "Une cheffe ouvre un restaurant familial et tombe amoureuse au bord de la mer.",
                      genre = "Action, Thriller",
                  )

                  val result = engine.compare(source, unrelated)

                  assertFalse(result.substantive)
                  assertEquals(0.0, result.score, 0.0001)
              }

          '''.replace("              ", ""),
          )

          insert_before(
              "app/src/test/java/fr/streamia/tv/recommendation/RecommendationEngineTest.kt",
              "    private fun movie(\n",
              '''    @Test
              fun `detail similarity keeps candidates matching both genre and story`() {
                  val sourceEntry = movie(90, "Deep Orbit", 8.4, "science", "équipage spatial mission planète inconnue")
                  val source = ContentFeatures(
                      entry = sourceEntry,
                      plot = sourceEntry.plot,
                      genre = "Science-fiction, Thriller",
                  )
                  val close = movie(1, "Silent Planet", 8.0, "science", "astronautes en mission sur une planète inconnue")
                  val unrelated = movie(2, "Kitchen Rush", 8.8, "science", "restaurant familial cuisine amour vacances")
                  val details = mapOf(
                      close.key to ContentFeatures(close, plot = close.plot, genre = "Science-fiction, Thriller"),
                      unrelated.key to ContentFeatures(unrelated, plot = unrelated.plot, genre = "Science-fiction, Thriller"),
                  )

                  val result = engine.similarTo(
                      source = source,
                      candidates = listOf(unrelated, close),
                      detailsByKey = details,
                  )

                  assertEquals(listOf(close.key), result.map { it.entry.key })
              }

          '''.replace("              ", ""),
          )
          PY

      - name: Verify new tests fail for the intended behavior
        run: |
          set +e
          gradle --no-daemon testDebugUnitTest \
            --tests 'fr.streamia.tv.recommendation.ContentSimilarityTest' \
            --tests 'fr.streamia.tv.recommendation.RecommendationEngineTest' \
            --stacktrace > red-test.log 2>&1
          status=$?
          cat red-test.log
          if [ "$status" -eq 0 ]; then
            echo "The new tests unexpectedly passed before the implementation."
            exit 1
          fi
          grep -R "same broad genre without related plot is rejected\|detail similarity keeps candidates matching both genre and story" \
            app/build/test-results/testDebugUnitTest >/dev/null

      - name: Implement recommendation candidate and scoring changes
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1))

          def regex_once(path: str, pattern: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"Pattern matched {count} times in {path}: {pattern[:100]!r}")
              file.write_text(updated)

          # Genre + synopsis become the dominant evidence. A broad genre alone is no longer enough.
          replace_once(
              "app/src/main/java/fr/streamia/tv/recommendation/ContentSimilarity.kt",
              '''        // Les signaux descriptifs dominent. Catégorie/année/note servent uniquement de
              // départage et ne peuvent pas créer un résultat similaire sans preuve sémantique.
              add(0.10, titleSimilarity, sourceTitleTokens.isNotEmpty() && candidateTitleTokens.isNotEmpty())
              add(0.34, plotSimilarity, sourcePlotTokens.isNotEmpty() && candidatePlotTokens.isNotEmpty())
              add(0.28, genreSimilarity, sourceGenres.isNotEmpty() && candidateGenres.isNotEmpty())
              add(0.08, castSimilarity, sourceCast.isNotEmpty() && candidateCast.isNotEmpty())
              add(0.10, directorSimilarity, sourceDirector.isNotEmpty() && candidateDirector.isNotEmpty())
              add(0.025, countrySimilarity, sourceCountries.isNotEmpty() && candidateCountries.isNotEmpty())
              add(0.035, yearSimilarity, extractYear(source) != null && extractYear(candidate) != null)
              add(0.02, ratingSimilarity, source.rating != null && candidate.rating != null)
              add(0.01, if (categoryMatch) 1.0 else 0.0, true)
              '''.replace("              ", ""),
              '''        // Pour une fiche détail, l'histoire et le genre doivent dominer nettement.
              // Catégorie IPTV, année et note restent seulement des critères de départage.
              add(0.06, titleSimilarity, sourceTitleTokens.isNotEmpty() && candidateTitleTokens.isNotEmpty())
              add(0.46, plotSimilarity, sourcePlotTokens.isNotEmpty() && candidatePlotTokens.isNotEmpty())
              add(0.34, genreSimilarity, sourceGenres.isNotEmpty() && candidateGenres.isNotEmpty())
              add(0.04, castSimilarity, sourceCast.isNotEmpty() && candidateCast.isNotEmpty())
              add(0.05, directorSimilarity, sourceDirector.isNotEmpty() && candidateDirector.isNotEmpty())
              add(0.01, countrySimilarity, sourceCountries.isNotEmpty() && candidateCountries.isNotEmpty())
              add(0.02, yearSimilarity, extractYear(source) != null && extractYear(candidate) != null)
              add(0.01, ratingSimilarity, source.rating != null && candidate.rating != null)
              add(0.01, if (categoryMatch) 1.0 else 0.0, true)
              '''.replace("              ", ""),
          )

          replace_once(
              "app/src/main/java/fr/streamia/tv/recommendation/ContentSimilarity.kt",
              '''        val strongTitleRelation = titleSimilarity >= 0.34
              val strongPlotRelation = plotSimilarity >= 0.10
              val genreRelation = genreSimilarity >= 0.34
              val peopleRelation = directorSimilarity >= 0.72 || castSimilarity >= 0.20
              val semanticRelation = semantic != null && semantic >= 0.58
              val substantive = strongTitleRelation || strongPlotRelation || genreRelation || peopleRelation || semanticRelation
              '''.replace("              ", ""),
              '''        val strongTitleRelation = titleSimilarity >= 0.45
              val plotAndGenreRelation = plotSimilarity >= 0.08 && genreSimilarity >= 0.34
              val strongPlotRelation = plotSimilarity >= 0.18
              val strongGenreUniverse = genreSimilarity >= 0.66 &&
                  (titleSimilarity >= 0.34 || castSimilarity >= 0.20 || directorSimilarity >= 0.72)
              val peopleRelation = directorSimilarity >= 0.72 || castSimilarity >= 0.30
              val semanticRelation = semantic != null && semantic >= 0.62
              val substantive = strongTitleRelation || plotAndGenreRelation || strongPlotRelation ||
                  strongGenreUniverse || peopleRelation || semanticRelation
              '''.replace("              ", ""),
          )

          replace_once(
              "app/src/main/java/fr/streamia/tv/recommendation/ContentSimilarity.kt",
              '''        val reason = when {
              directorSimilarity >= 0.72 -> "Même réalisateur"
              genreSimilarity >= 0.66 && plotSimilarity >= 0.10 -> "Genres, intrigue et univers proches"
              semantic != null && semantic >= 0.72 -> "Intrigue et ambiance similaires"
              genreSimilarity >= 0.50 -> "Genres et univers proches"
              plotSimilarity >= 0.18 -> "Intrigue et thèmes similaires"
              castSimilarity >= 0.25 -> "Distribution similaire"
              titleSimilarity >= 0.45 -> "Même saga ou univers"
              else -> null
              }
              '''.replace("              ", ""),
              '''        val reason = when {
              genreSimilarity >= 0.66 && plotSimilarity >= 0.10 -> "Genre, intrigue et univers très proches"
              plotAndGenreRelation -> "Genre et histoire similaires"
              semantic != null && semantic >= 0.72 -> "Intrigue et ambiance similaires"
              directorSimilarity >= 0.72 -> "Même réalisateur"
              plotSimilarity >= 0.18 -> "Intrigue et thèmes similaires"
              castSimilarity >= 0.30 -> "Distribution similaire"
              titleSimilarity >= 0.45 -> "Même saga ou univers"
              else -> null
              }
              '''.replace("              ", ""),
          )

          # Separate fast indexed pools for home discovery and source-specific detail similarity.
          replace_once(
              "app/src/main/java/fr/streamia/tv/data/CatalogDatabase.kt",
              '''    fun loadRecommendationCandidates(profileId: String, type: MediaType, limit: Int): List<MediaEntry> =
                  loadRecent(profileId, type, limit)

              private fun loadRecent(profileId: String, type: MediaType, limit: Int): List<MediaEntry> {
              '''.replace("              ", ""),
              '''    fun loadHomeRecommendationCandidates(profileId: String, type: MediaType, limit: Int): List<MediaEntry> =
                  loadRecent(profileId, type, limit)

              /**
               * Candidats de fiche détail : la majorité vient de la même catégorie fournisseur,
               * autour de la position du média. Les deux requêtes utilisent idx_catalog_category,
               * restent rapides même avec 200k films, puis les contenus récents servent de repli.
               */
              fun loadSimilarityCandidates(profileId: String, source: MediaEntry, limit: Int): List<MediaEntry> {
                  if (limit <= 0) return emptyList()
                  val categoryTarget = (limit * 3 / 4).coerceAtLeast(1)
                  val forward = loadCategoryNeighbors(profileId, source, forward = true, limit = categoryTarget)
                  val backward = loadCategoryNeighbors(profileId, source, forward = false, limit = categoryTarget)
                  val categoryCandidates = interleave(forward, backward, categoryTarget)
                  return buildList {
                      addAll(categoryCandidates)
                      loadRecent(profileId, source.type, limit).forEach { candidate ->
                          if (candidate.key != source.key && none { it.key == candidate.key }) add(candidate)
                      }
                  }.take(limit)
              }

              private fun loadCategoryNeighbors(
                  profileId: String,
                  source: MediaEntry,
                  forward: Boolean,
                  limit: Int,
              ): List<MediaEntry> {
                  if (limit <= 0) return emptyList()
                  val comparison = if (forward) ">" else "<"
                  val direction = if (forward) "ASC" else "DESC"
                  return readableDatabase.rawQuery(
                      """
                      SELECT ${ENTRY_COLUMNS.joinToString()} FROM catalog_entries
                      WHERE profile_id = ? AND media_type = ? AND category_id = ? AND navigable = 1
                        AND (number $comparison ? OR (number = ? AND media_id $comparison ?))
                      ORDER BY number $direction, media_id $direction
                      LIMIT ?
                      """.trimIndent(),
                      arrayOf(
                          profileId,
                          source.type.name,
                          source.categoryId,
                          source.number.toString(),
                          source.number.toString(),
                          source.id.toString(),
                          limit.toString(),
                      ),
                  ).use(::readEntries)
              }

              private fun interleave(
                  first: List<MediaEntry>,
                  second: List<MediaEntry>,
                  limit: Int,
              ): List<MediaEntry> {
                  val result = ArrayList<MediaEntry>(limit)
                  var index = 0
                  while (result.size < limit && (index < first.size || index < second.size)) {
                      if (index < first.size) result += first[index]
                      if (result.size < limit && index < second.size) result += second[index]
                      index += 1
                  }
                  return result
              }

              private fun loadRecent(profileId: String, type: MediaType, limit: Int): List<MediaEntry> {
              '''.replace("              ", ""),
          )

          replace_once(
              "app/src/main/java/fr/streamia/tv/data/CatalogCache.kt",
              '''    /**
               * Pool borné pour l'IA : lit seulement les contenus VOD récents via l'index SQLite existant.
               * On évite ainsi de matérialiser des dizaines de milliers de films/séries dans le ViewModel.
               */
              suspend fun loadRecommendationCandidates(
                  profileId: String,
                  type: MediaType,
                  limit: Int,
              ): List<MediaEntry> = withContext(Dispatchers.IO) {
                  ensureMigrated(profileId)
                  database.loadRecommendationCandidates(profileId, type, limit)
              }
              '''.replace("              ", ""),
              '''    /** Pool récent borné, utilisé pour « À découvrir » et « Nouveautés ». */
              suspend fun loadHomeRecommendationCandidates(
                  profileId: String,
                  type: MediaType,
                  limit: Int,
              ): List<MediaEntry> = withContext(Dispatchers.IO) {
                  ensureMigrated(profileId)
                  database.loadHomeRecommendationCandidates(profileId, type, limit)
              }

              /** Pool indexé centré sur le film ou la série actuellement ouvert. */
              suspend fun loadSimilarityCandidates(
                  profileId: String,
                  source: MediaEntry,
                  limit: Int,
              ): List<MediaEntry> = withContext(Dispatchers.IO) {
                  ensureMigrated(profileId)
                  database.loadSimilarityCandidates(profileId, source, limit)
              }
              '''.replace("              ", ""),
          )

          replace_once(
              "app/src/main/java/fr/streamia/tv/data/XtreamRepository.kt",
              '''    /** Pool borné de candidats VOD pour le moteur de recommandation (accueil et fiches détail). */
              suspend fun recommendationCandidates(profileId: String, type: MediaType, limit: Int): List<MediaEntry> =
                  cache.loadRecommendationCandidates(profileId, type, limit)
              '''.replace("              ", ""),
              '''    /** Contenus récents pour l'accueil ; les goûts complètent ce pool dans le ViewModel. */
              suspend fun homeRecommendationCandidates(profileId: String, type: MediaType, limit: Int): List<MediaEntry> =
                  cache.loadHomeRecommendationCandidates(profileId, type, limit)

              /** Candidats rapides et centrés sur la catégorie du média affiché dans une fiche détail. */
              suspend fun similarityCandidates(profileId: String, source: MediaEntry, limit: Int): List<MediaEntry> =
                  cache.loadSimilarityCandidates(profileId, source, limit)

              /** Retours explicites déjà persistés : « plus comme ça » / « moins comme ça ». */
              suspend fun recommendationFeedback(profileId: String) =
                  withContext(Dispatchers.IO) { recommendationStore.feedback(profileId) }
              '''.replace("              ", ""),
          )

          # Home = recent + candidates around recent history/favorites; detail = source-specific pool.
          replace_once(
              "app/src/main/java/fr/streamia/tv/ui/StreamiaViewModel.kt",
              '''            val candidates = listOf(MediaType.Movie, MediaType.Series).flatMap { type ->
                  runCatching {
                      repository.recommendationCandidates(profileId, type, HOME_RECOMMENDATION_CANDIDATE_LIMIT)
                  }.getOrDefault(emptyList())
              }
              '''.replace("              ", ""),
              '''            val tasteSources = (
                  library.history.sortedByDescending { it.updatedAt }.map { it.entry } +
                      library.favoriteEntries.mapNotNull(catalog::entry)
              ).distinctBy(MediaEntry::key).take(HOME_RECOMMENDATION_TASTE_SOURCE_LIMIT)
              val candidates = listOf(MediaType.Movie, MediaType.Series).flatMap { type ->
                  val recent = runCatching {
                      repository.homeRecommendationCandidates(profileId, type, HOME_RECOMMENDATION_RECENT_LIMIT)
                  }.getOrDefault(emptyList())
                  val tasteCandidates = mutableListOf<MediaEntry>()
                  for (source in tasteSources) {
                      if (source.type != type) continue
                      tasteCandidates += runCatching {
                          repository.similarityCandidates(profileId, source, HOME_RECOMMENDATION_PER_SOURCE_LIMIT)
                      }.getOrDefault(emptyList())
                  }
                  (recent + tasteCandidates)
                      .distinctBy(MediaEntry::key)
                      .take(HOME_RECOMMENDATION_CANDIDATE_LIMIT)
              }
              '''.replace("              ", ""),
          )

          replace_once(
              "app/src/main/java/fr/streamia/tv/ui/StreamiaViewModel.kt",
              '''            val detailsByKey = runCatching {
                  repository.recommendationContentFeatures(profileId, detailsSource)
              }.getOrDefault(emptyMap())

              if (sequence != homeRecommendationBuildSequence || _uiState.value.activeProfileId != profileId) return@launch
              '''.replace("              ", ""),
              '''            val detailsByKey = runCatching {
                  repository.recommendationContentFeatures(profileId, detailsSource)
              }.getOrDefault(emptyMap())
              val feedback = runCatching { repository.recommendationFeedback(profileId) }.getOrDefault(emptyMap())

              if (sequence != homeRecommendationBuildSequence || _uiState.value.activeProfileId != profileId) return@launch
              '''.replace("              ", ""),
          )

          replace_once(
              "app/src/main/java/fr/streamia/tv/ui/StreamiaViewModel.kt",
              '''                    knownEntriesByKey = knownEntriesByKey,
                  hiddenEntries = library.hiddenEntries,
              '''.replace("              ", ""),
              '''                    knownEntriesByKey = knownEntriesByKey,
                  feedback = feedback,
                  hiddenEntries = library.hiddenEntries,
              '''.replace("              ", ""),
          )

          replace_once(
              "app/src/main/java/fr/streamia/tv/ui/StreamiaViewModel.kt",
              "repository.recommendationCandidates(profileId, entry.type, SIMILAR_CANDIDATE_LIMIT)",
              "repository.similarityCandidates(profileId, entry, SIMILAR_CANDIDATE_LIMIT)",
          )

          vm = Path("app/src/main/java/fr/streamia/tv/ui/StreamiaViewModel.kt")
          text = vm.read_text()
          text = re.sub(
              r"private const val HOME_RECOMMENDATION_CANDIDATE_LIMIT = 400",
              "private const val HOME_RECOMMENDATION_CANDIDATE_LIMIT = 400\n"
              "private const val HOME_RECOMMENDATION_RECENT_LIMIT = 240\n"
              "private const val HOME_RECOMMENDATION_TASTE_SOURCE_LIMIT = 4\n"
              "private const val HOME_RECOMMENDATION_PER_SOURCE_LIMIT = 80",
              text,
              count=1,
          )
          text = re.sub(r"private const val SIMILAR_CANDIDATE_LIMIT = 400", "private const val SIMILAR_CANDIDATE_LIMIT = 300", text, count=1)
          text = re.sub(r"private const val SIMILAR_ENRICH_LIMIT = 15", "private const val SIMILAR_ENRICH_LIMIT = 12", text, count=1)
          text = re.sub(r"private const val SIMILAR_ENRICH_CONCURRENCY = 3", "private const val SIMILAR_ENRICH_CONCURRENCY = 4", text, count=1)
          text = re.sub(r"private const val SIMILAR_DETAIL_MIN_SCORE = 0\.18", "private const val SIMILAR_DETAIL_MIN_SCORE = 0.28", text, count=1)
          for required in (
              "HOME_RECOMMENDATION_RECENT_LIMIT",
              "HOME_RECOMMENDATION_TASTE_SOURCE_LIMIT",
              "HOME_RECOMMENDATION_PER_SOURCE_LIMIT",
              "SIMILAR_DETAIL_MIN_SCORE = 0.28",
          ):
              if required not in text:
                  raise SystemExit(f"ViewModel constant patch missing: {required}")
          vm.write_text(text)
          PY

      - name: Run unit tests and lint
        run: gradle --no-daemon testDebugUnitTest lintDebug --stacktrace

      - name: Commit implementation and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-recommendation-refactor.yml
          git add app/src/main app/src/test
          git commit -m "feat: improve fast film and series recommendations"
          git push origin HEAD:claude/ios-glass-theme
