name: Apply recommendation refactor v3

on:
  push:
    branches: [claude/ios-glass-theme]
    paths: [.github/workflows/apply-recommendation-refactor-v3.yml]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: claude/ios-glass-theme
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Apply deterministic recommendation refactor
        run: |
          python3 -m py_compile .github/scripts/apply_recommendation_refactor.py .github/scripts/refine_plot_tokens.py
          python3 .github/scripts/apply_recommendation_refactor.py
          python3 .github/scripts/refine_plot_tokens.py

      - name: Run unit tests and lint
        run: gradle --no-daemon testDebugUnitTest lintDebug --stacktrace

      - name: Commit implementation and remove temporary automation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-recommendation-refactor.yml
          git rm .github/workflows/apply-recommendation-refactor-v3.yml
          git rm .github/scripts/apply_recommendation_refactor.py
          git rm .github/scripts/refine_plot_tokens.py
          git add app/src/main app/src/test
          git commit -m "feat: improve fast film and series recommendations"
          git push origin HEAD:claude/ios-glass-theme
