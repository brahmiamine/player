name: Android TV APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Android SDK packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms
            ${{ env.ANDROID_HOME }}/build-tools
          key: android-sdk-platforms-36-build-tools-35.0.0

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Unit tests and lint
        run: |
          if ! gradle --no-daemon testDebugUnitTest lintDebug; then
            test -f app/build/reports/lint-results-debug.txt && cat app/build/reports/lint-results-debug.txt
            exit 1
          fi

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Decode release keystore
        if: github.event_name != 'pull_request'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          # Secret absent (pas encore configuré) : on ne pose pas RELEASE_STORE_FILE, et
          # app/build.gradle.kts retombe silencieusement sur la clé debug, comme avant.
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build optimized APK
        if: github.event_name != 'pull_request'
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon assembleOptimized

      - name: Report APK sizes
        run: du -h app/build/outputs/apk/debug/app-debug.apk

      - name: Report optimized APK size
        if: github.event_name != 'pull_request'
        run: du -h app/build/outputs/apk/optimized/app-optimized.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: streamia-tv-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload optimized APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: streamia-tv-optimized-apk
          path: app/build/outputs/apk/optimized/app-optimized.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK in latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/optimized/app-optimized.apk streamia-tv.apk

          # Keep a stable `latest` tag so the direct APK download URL never changes.
          git tag -f latest "$GITHUB_SHA"
          git push --force origin refs/tags/latest

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest streamia-tv.apk --clobber
            gh release edit latest \
              --title "Streamia TV - Dernier build" \
              --notes "APK Android TV généré automatiquement depuis main (${GITHUB_SHA::7}). Téléchargez directement streamia-tv.apk." \
              --latest
          else
            gh release create latest streamia-tv.apk \
              --title "Streamia TV - Dernier build" \
              --notes "APK Android TV généré automatiquement depuis main (${GITHUB_SHA::7}). Téléchargez directement streamia-tv.apk." \
              --latest
          fi

      - name: Publish tagged APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/optimized/app-optimized.apk "streamia-tv-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "streamia-tv-${GITHUB_REF_NAME}.apk" --generate-notes --title "Streamia TV ${GITHUB_REF_NAME}"
