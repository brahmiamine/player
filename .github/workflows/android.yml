name: Android TV APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Android SDK packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms
            ${{ env.ANDROID_HOME }}/build-tools
          key: android-sdk-platforms-36-build-tools-35.0.0

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Unit tests and lint
        id: unit_tests_lint
        continue-on-error: true
        run: |
          set +e
          gradle --no-daemon testDebugUnitTest lintDebug --stacktrace > gradle-output.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          test -f app/build/reports/lint-results-debug.txt && cat app/build/reports/lint-results-debug.txt >> gradle-output.log
          cat gradle-output.log

      # TEMPORARY diagnostic: this sandbox has no way to read GitHub Actions job logs (they're
      # served from Azure blob storage, blocked by this environment's egress policy), so post the
      # failure tail as a PR comment instead — a plain api.github.com call, which is reachable.
      # Remove this step once CI is green again.
      - name: Post failure log as PR comment (diagnostic)
        if: steps.unit_tests_lint.outputs.exit_code != '0' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 60000 gradle-output.log > tail.log
          cat > build_comment.py << 'PYEOF'
          import json
          with open('tail.log') as f:
              text = f.read()
          body = "### Unit tests/lint failure (diagnostic)\n\n<details><summary>gradle-output.log tail</summary>\n\n```\n" + text + "\n```\n\n</details>"
          with open('comment.json', 'w') as out:
              json.dump({'body': body}, out)
          PYEOF
          python3 build_comment.py
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -d @comment.json

      - name: Fail job if unit tests/lint failed
        if: steps.unit_tests_lint.outputs.exit_code != '0'
        run: exit 1

      - name: Build debug APK
        id: build_debug
        continue-on-error: true
        run: |
          set +e
          gradle --no-daemon assembleDebug --stacktrace > gradle-assemble-output.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat gradle-assemble-output.log

      # TEMPORARY diagnostic — see the "Unit tests and lint" step above for why. Remove once green.
      - name: Post assembleDebug failure log as PR comment (diagnostic)
        if: steps.build_debug.outputs.exit_code != '0' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 60000 gradle-assemble-output.log > tail.log
          cat > build_comment.py << 'PYEOF'
          import json
          with open('tail.log') as f:
              text = f.read()
          body = "### assembleDebug failure (diagnostic)\n\n<details><summary>gradle-assemble-output.log tail</summary>\n\n```\n" + text + "\n```\n\n</details>"
          with open('comment2.json', 'w') as out:
              json.dump({'body': body}, out)
          PYEOF
          python3 build_comment.py
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -d @comment2.json

      - name: Fail job if assembleDebug failed
        if: steps.build_debug.outputs.exit_code != '0'
        run: exit 1

      - name: Decode release keystore
        if: github.event_name != 'pull_request'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          # Secret absent (pas encore configuré) : on ne pose pas RELEASE_STORE_FILE, et
          # app/build.gradle.kts retombe silencieusement sur la clé debug, comme avant.
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build optimized APK
        if: github.event_name != 'pull_request'
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon assembleOptimized

      - name: Report APK sizes
        id: report_size
        continue-on-error: true
        run: |
          set +e
          {
            echo "--- find app/build/outputs ---"
            find app/build/outputs -type f 2>&1
            echo "--- du ---"
            du -h app/build/outputs/apk/debug/app-debug.apk
          } > report-size-output.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat report-size-output.log

      # TEMPORARY diagnostic — see the "Unit tests and lint" step above for why. Remove once green.
      - name: Post APK-size failure log as PR comment (diagnostic)
        if: steps.report_size.outputs.exit_code != '0' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 60000 report-size-output.log > tail.log
          cat > build_comment.py << 'PYEOF'
          import json
          with open('tail.log') as f:
              text = f.read()
          body = "### Report APK sizes failure (diagnostic)\n\n<details><summary>report-size-output.log tail</summary>\n\n```\n" + text + "\n```\n\n</details>"
          with open('comment3.json', 'w') as out:
              json.dump({'body': body}, out)
          PYEOF
          python3 build_comment.py
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -d @comment3.json

      - name: Fail job if reporting APK size failed
        if: steps.report_size.outputs.exit_code != '0'
        run: exit 1

      - name: Report optimized APK size
        if: github.event_name != 'pull_request'
        run: du -h app/build/outputs/apk/optimized/app-optimized.apk

      # TEMPORARY diagnostic — always posts, to see ground truth right before the upload step that
      # keeps reporting "no files found" despite the immediately preceding `du` succeeding. Remove
      # once green.
      - name: Post pre-upload directory snapshot as PR comment (diagnostic)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            echo "--- pwd ---"
            pwd
            echo "--- ls -la app/build/outputs/apk/debug/ ---"
            ls -la app/build/outputs/apk/debug/ 2>&1
            echo "--- find app/build/outputs (full stat) ---"
            find app/build/outputs -exec ls -la {} \; 2>&1
            echo "--- df -h . ---"
            df -h . 2>&1
          } > snapshot.log 2>&1
          tail -c 60000 snapshot.log > tail.log
          cat > build_comment.py << 'PYEOF'
          import json
          with open('tail.log') as f:
              text = f.read()
          body = "### Pre-upload directory snapshot (diagnostic)\n\n<details><summary>snapshot.log</summary>\n\n```\n" + text + "\n```\n\n</details>"
          with open('comment4.json', 'w') as out:
              json.dump({'body': body}, out)
          PYEOF
          python3 build_comment.py
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -d @comment4.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: streamia-tv-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload optimized APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: streamia-tv-optimized-apk
          path: app/build/outputs/apk/optimized/app-optimized.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK in latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/optimized/app-optimized.apk streamia-tv.apk

          # Keep a stable `latest` tag so the direct APK download URL never changes.
          git tag -f latest "$GITHUB_SHA"
          git push --force origin refs/tags/latest

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest streamia-tv.apk --clobber
            gh release edit latest \
              --title "Streamia TV - Dernier build" \
              --notes "APK Android TV généré automatiquement depuis main (${GITHUB_SHA::7}). Téléchargez directement streamia-tv.apk." \
              --latest
          else
            gh release create latest streamia-tv.apk \
              --title "Streamia TV - Dernier build" \
              --notes "APK Android TV généré automatiquement depuis main (${GITHUB_SHA::7}). Téléchargez directement streamia-tv.apk." \
              --latest
          fi

      - name: Publish tagged APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/optimized/app-optimized.apk "streamia-tv-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "streamia-tv-${GITHUB_REF_NAME}.apk" --generate-notes --title "Streamia TV ${GITHUB_REF_NAME}"
